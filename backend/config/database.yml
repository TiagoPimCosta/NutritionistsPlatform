default: &default
  adapter: postgresql
  encoding: unicode
  username: backend
  password: backendPassword
  host: postgres
  port: 5432

development:
  <<: *default
  username:
  host: localhost
  database: backend_development_postgres

test:
  <<: *default
  username:
  host: localhost
  database: backend_test_postgres

production:
  primary:
    <<: *default
    database: backend_production_postgres
  queue:
    <<: *default
    database: backend_production_queue
    migrations_paths: db/queue_migrate
  cache:
    <<: *default
    database: backend_production_cache
    migrations_paths: db/cache_migrate
